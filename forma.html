<title>Forma Body Coach</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,300..900&family=Caveat:wght@500..700&family=Figtree:wght@400..800&display=swap">
<style>
:root{
  /* Layout: one phone-width column, sticky top bar, floating tab bar; cards only where an object needs edges.
     Identity: a coach's notebook — ultramarine ink, highlighter marks, tape-measure scales, condensed scoreboard numerals. */
  --bg:#eceef5;--surface:#ffffff;--surface-2:#e3e6f0;--ink:#0f1226;--ink-2:#454b69;--ink-3:#6d7396;--line:#d6dae7;
  --accent:#3b2dff;--accent-ink:#ffffff;--accent-soft:#e4e2ff;--hi:#ffe066;--hi-ink:#1d1800;
  --protein:#4f46e5;--carbs:#c27c00;--fat:#d6407a;
  --good:#1d8a4b;--warn:#a86300;--bad:#c42f3b;
  --mo-1:#8a80ff;--mo-2:#3b2dff;--mo-ink:#0f1226;
  --scrim:rgba(8,10,24,.42);
  --shadow:0 1px 2px rgba(15,18,38,.05),0 12px 30px -14px rgba(15,18,38,.20);
  --paper-line:rgba(59,45,255,.08);
  --f-display:"Anybody","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  --ease-out:cubic-bezier(.23,1,.32,1);--ease-in-out:cubic-bezier(.77,0,.175,1);--ease-drawer:cubic-bezier(.32,.72,0,1);
  --r:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0c19;--surface:#141731;--surface-2:#1e2244;--ink:#eef0ff;--ink-2:#b3b8d9;--ink-3:#8a90b4;--line:#2a2f55;
  --accent:#8f86ff;--accent-ink:#0a0c19;--accent-soft:#25225f;--hi:#f2cc4b;--hi-ink:#1d1800;
  --protein:#7f78f5;--carbs:#bd8210;--fat:#df5d90;--good:#4cc27e;--warn:#e2a23b;--bad:#f0707a;
  --mo-1:#a9a2ff;--mo-2:#5b4dff;--mo-ink:#0a0c19;--scrim:rgba(0,0,0,.6);
  --shadow:0 0 0 1px rgba(255,255,255,.04),0 14px 30px -14px rgba(0,0,0,.7);--paper-line:rgba(143,134,255,.10);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0c19;--surface:#141731;--surface-2:#1e2244;--ink:#eef0ff;--ink-2:#b3b8d9;--ink-3:#8a90b4;--line:#2a2f55;
  --accent:#8f86ff;--accent-ink:#0a0c19;--accent-soft:#25225f;--hi:#f2cc4b;--hi-ink:#1d1800;
  --protein:#7f78f5;--carbs:#bd8210;--fat:#df5d90;--good:#4cc27e;--warn:#e2a23b;--bad:#f0707a;
  --mo-1:#a9a2ff;--mo-2:#5b4dff;--mo-ink:#0a0c19;--scrim:rgba(0,0,0,.6);
  --shadow:0 0 0 1px rgba(255,255,255,.04),0 14px 30px -14px rgba(0,0,0,.7);--paper-line:rgba(143,134,255,.10);
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
input,textarea,select{font:inherit;font-size:16px;color:inherit}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-stretch:116%;font-weight:760;letter-spacing:-.015em;text-wrap:balance;margin:0;line-height:1.08}
h1{font-size:28px}h2{font-size:19px}h3{font-size:16px}
p{margin:0}
.num{font-family:var(--f-display);font-stretch:62%;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:0}
.label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:750;color:var(--ink-3)}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.hand{font-family:var(--f-hand);font-weight:650;color:var(--accent);font-size:21px;line-height:1}
mark{color:var(--hi-ink);background:linear-gradient(100deg,transparent .15em,var(--hi) .15em,var(--hi) calc(100% - .1em),transparent calc(100% - .1em));padding:0 .22em;border-radius:.35em .6em .4em .55em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
a{color:var(--accent)}

/* ---------- shell ---------- */
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(118px + env(safe-area-inset-bottom,0px))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px;background:var(--bg)}
.brand{display:flex;flex-direction:column;gap:1px;min-width:0}
.wordmark{font-family:var(--f-display);font-stretch:150%;font-weight:860;font-size:21px;letter-spacing:-.03em;line-height:1}
.wordmark i{font-style:normal;color:var(--accent)}
.topbar .label{white-space:nowrap}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;font-weight:800;font-size:15px;color:var(--accent);transition:transform 140ms var(--ease-out)}
.avatar:active{transform:scale(.94)}
.banner{display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--hi);color:var(--hi-ink);border-radius:16px;padding:10px 12px 10px 14px;margin-bottom:12px;font-size:13.5px;font-weight:600}
.banner button{background:var(--hi-ink);color:var(--hi);border-radius:11px;padding:8px 12px;font-weight:750;white-space:nowrap;transition:transform 140ms var(--ease-out)}
.banner button:active{transform:scale(.96)}
.view{display:grid;gap:14px}
.view.enter>*{animation:rise 300ms var(--ease-out) both;animation-delay:calc(var(--i,0)*38ms)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.tabbar-in{pointer-events:auto;max-width:440px;margin:0 auto;position:relative;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-radius:26px;box-shadow:0 18px 40px -16px rgba(15,18,38,.35),0 0 0 1px var(--line);padding:6px}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-radius:20px;color:var(--ink-3);font-size:11px;font-weight:750;letter-spacing:.01em;transition:color 200ms ease}
.tab svg{width:23px;height:23px;transition:transform 140ms var(--ease-out)}
.tab:active svg{transform:scale(.88)}
.tab[aria-selected="true"]{color:var(--accent)}
.tab-ind{position:absolute;z-index:0;top:6px;left:6px;height:calc(100% - 12px);width:calc((100% - 12px)/5);border-radius:20px;background:var(--accent-soft);transform:translateX(calc(var(--ti,0)*100%));transition:transform 320ms var(--ease-out)}
.tabbar[hidden]{display:none}

/* ---------- generic pieces ---------- */
.card{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.stack{display:grid;gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.good{color:var(--good)}.chip.warn{color:var(--warn)}.chip.bad{color:var(--bad)}
.chip svg{width:14px;height:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:16px;font-weight:750;font-size:15.5px;background:var(--accent);color:var(--accent-ink);transition:transform 140ms var(--ease-out),opacity 200ms ease}
.btn:active{transform:scale(.97)}
.btn svg{width:20px;height:20px}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.line{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent-soft)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:0 13px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{color:var(--accent);font-weight:750;font-size:14px;display:inline-flex;align-items:center;gap:4px;transition:opacity 150ms ease}
.link svg{width:16px;height:16px}
.link:active{opacity:.6}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2);transition:transform 140ms var(--ease-out)}
.iconbtn:active{transform:scale(.92)}
.iconbtn svg{width:18px;height:18px}
.field{display:grid;gap:6px;min-width:0}
.view,.stack,.sheet-body,.ob-stage,.field,.choices{grid-template-columns:minmax(0,1fr)}
.tape{min-width:0;max-width:100%}
.field input,.field textarea,.field select{width:100%;min-height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;transition:border-color 150ms ease}
.field textarea{padding:12px 14px;resize:none;min-height:70px}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:6px 2px -2px}
.empty{padding:22px;text-align:center;color:var(--ink-3);border:1.5px dashed var(--line);border-radius:18px;font-size:14px}
.src{font-size:12px;color:var(--ink-3);font-style:italic}
.err{color:var(--bad);font-size:13.5px;font-weight:600}
@media (hover:hover) and (pointer:fine){
  .btn:hover{filter:brightness(1.06)}
  .qa:hover{background:var(--accent-soft)}
  .food-row:hover .rm{opacity:1}
  .choice:hover{box-shadow:inset 0 0 0 1.5px var(--ink-3)}
}

/* ---------- Mo, the coach ---------- */
.mo{display:inline-block;flex:none;line-height:0}
.mo svg{width:100%;height:100%;overflow:visible}
.mo-sm{width:34px;height:34px}.mo-md{width:62px;height:62px}.mo-lg{width:96px;height:96px}.mo-xl{width:132px;height:132px}
.mo-body{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 4.2s var(--ease-in-out) infinite alternate;animation-delay:var(--bd,0s)}
.mo-eye{transform-box:fill-box;transform-origin:center;animation:blink var(--blink,5s) infinite;animation-delay:var(--bd,0s)}
.mo .pp{fill:var(--mo-ink)}
.mo-mouth{stroke:var(--mo-ink);transition:d 260ms var(--ease-out)}
.mo-pupil{transition:transform 300ms var(--ease-out)}
.mo[data-mood="think"] .mo-pupil{transform:translate(2.6px,-3.2px)}
.mo[data-mood="think"] .mo-body{animation:breathe 1.1s var(--ease-in-out) infinite alternate}
.mo[data-mood="wow"] .mo-body{animation:hop 620ms var(--ease-out) 2}
@keyframes breathe{from{transform:scale(1,1)}to{transform:scale(1.025,.975)}}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}35%{transform:translateY(-10%) scale(.97,1.04)}70%{transform:translateY(0) scale(1.05,.95)}}

/* ---------- Today ---------- */
.hello{display:flex;align-items:flex-end;gap:10px;padding-top:4px}
.bubble{position:relative;background:var(--surface);border-radius:20px 20px 20px 6px;padding:13px 15px;box-shadow:var(--shadow);font-size:15.5px;line-height:1.5;min-width:0;flex:1}
.bubble b{font-weight:780}
.journey .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.journey h2{font-size:22px}
.journey .eta{font-size:14px;color:var(--ink-2);margin-top:4px}
.journey .eta b{color:var(--ink);white-space:nowrap}
.tapeviz{position:relative;margin:10px -4px 0;height:96px}
.tapeviz svg{display:block;overflow:visible}
.t-body{fill:var(--surface-2)}.t-prog{fill:var(--accent-soft)}
.t-tick{stroke:var(--ink-3)}.t-tick.maj{stroke:var(--ink-2)}
.t-lab{fill:var(--ink-3);font:700 10.5px var(--f-body);font-variant-numeric:tabular-nums}
.t-cur{fill:var(--accent)}.t-curl{stroke:var(--accent)}
.t-flag{fill:var(--hi);stroke:var(--ink);stroke-width:1.4}.t-pole{stroke:var(--ink)}
.t-you{fill:var(--accent);font:650 19px var(--f-hand)}
.t-arrow{stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linecap:round}
.t-cap{fill:var(--ink-2);font:750 11px var(--f-body)}
.note-warn{margin-top:10px;font-size:13.5px;background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--ink);border-radius:12px;padding:9px 11px}
.fuel-top{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{stroke:var(--surface-2)}
.ring .val{stroke:var(--accent);stroke-linecap:round}
.ring.over .val{stroke:var(--warn)}
.ring-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:0}
.ring-c .num{font-size:38px;line-height:.95}
.fuel-side{display:grid;gap:10px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:7px}
.kv:last-child{border-bottom:0;padding-bottom:0}
.kv b{font-size:22px}
.macros{display:grid;gap:10px;margin-top:16px}
.macro .between{font-size:13.5px;margin-bottom:5px}
.macro .between span:first-child{font-weight:750;display:flex;align-items:center;gap:7px}
.macro .between span:last-child{font-variant-numeric:tabular-nums;color:var(--ink-2)}
.swatch{width:10px;height:10px;border-radius:3px;display:inline-block}
.bar{height:9px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;transform-origin:left;transform:scaleX(0)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qa{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 4px 12px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);font-size:12.5px;font-weight:750;text-align:center;transition:transform 140ms var(--ease-out),background 200ms ease}
.qa:active{transform:scale(.96)}
.qa .ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.qa .ic svg{width:22px;height:22px}
.qa.prime .ic{background:var(--accent);color:var(--accent-ink)}
.sess-list{display:grid;gap:8px;margin:12px 0 14px;padding:0;list-style:none}
.sess-list li{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;min-width:0}
.sess-list li span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess-list li span:last-child{color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.water{display:grid;grid-template-columns:repeat(var(--n),minmax(0,34px));gap:5px;margin-top:12px}
.glass{position:relative;width:100%;aspect-ratio:3/4;max-width:100%;border-radius:5px 5px 10px 10px;box-shadow:inset 0 0 0 1.8px var(--line);overflow:hidden;transition:transform 140ms var(--ease-out)}
.glass:active{transform:scale(.9)}
.glass i{position:absolute;inset:auto 0 0;height:84%;background:var(--accent);opacity:.85;transform-origin:bottom;transform:scaleY(0);transition:transform 320ms var(--ease-out)}
.glass.on i{transform:scaleY(1)}
.strat{display:grid;gap:12px;margin:12px 0 4px;padding:0;list-style:none}
.strat li{display:grid;gap:3px;padding-left:14px;border-left:3px solid var(--accent-soft)}
.strat li b{font-size:15px}
.strat li p{font-size:14px;color:var(--ink-2)}
.notebook{background:var(--surface);background-image:linear-gradient(var(--paper-line) 1px,transparent 1px);background-size:100% 26px;background-position:0 12px;border-radius:var(--r);padding:16px 18px 18px;box-shadow:var(--shadow)}
.notebook p{font-size:15.5px;line-height:26px}
.notebook .hand{font-size:24px}

/* ---------- segmented ---------- */
.seg{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);background:var(--surface-2);border-radius:15px;padding:4px}
.seg button{position:relative;z-index:1;min-height:38px;border-radius:11px;font-weight:750;font-size:14px;color:var(--ink-2);transition:color 200ms ease}
.seg button[aria-selected="true"]{color:var(--ink)}
.seg-ind{position:absolute;top:4px;left:4px;bottom:4px;width:calc((100% - 8px)/var(--n));border-radius:11px;background:var(--surface);box-shadow:0 1px 3px rgba(15,18,38,.12);transform:translateX(calc(var(--i)*100%));transition:transform 280ms var(--ease-out)}

/* ---------- Body ---------- */
.bf-hero{display:grid;gap:14px}
.bf-hero .big{font-size:64px;line-height:.85}
.bf-hero .big small{font-size:28px;margin-left:2px}
.bands{display:grid;grid-template-columns:var(--cols);gap:3px;position:relative;margin-top:2px}
.bands span{height:12px;background:var(--surface-2);border-radius:3px}
.bands span.on{background:var(--accent-soft)}
.bands-lab{display:grid;grid-template-columns:var(--cols);gap:3px;font-size:10.5px;font-weight:700;color:var(--ink-3);margin-top:5px}
.bands-lab span{text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bands-lab span.on{color:var(--accent)}
.pin{position:absolute;top:-5px;width:3px;height:22px;border-radius:2px;background:var(--accent);transform:translateX(-50%);box-shadow:0 0 0 2px var(--surface)}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px}
.split i{display:block;height:100%}
.tile{display:grid;gap:4px;text-align:left;background:var(--surface);border-radius:20px;padding:15px;box-shadow:var(--shadow);transition:transform 140ms var(--ease-out);min-width:0}
.tile:active{transform:scale(.97)}
.tile .between{align-items:flex-start}
.tile .between svg{width:17px;height:17px;color:var(--ink-3);flex:none}
.tile .num{font-size:34px;line-height:1}
.tile .num small{font-size:16px;margin-left:2px;color:var(--ink-2)}
.tile p{font-size:13px;color:var(--ink-2)}
.chart{position:relative;margin-top:10px;min-height:120px}
.chart svg{display:block;overflow:visible}
.c-grid{stroke:var(--line)}
.c-axis{fill:var(--ink-3);font:650 10.5px var(--f-body);font-variant-numeric:tabular-nums}
.c-line{stroke:var(--accent);fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.c-area{fill:var(--accent);opacity:.10}
.c-goal{stroke:var(--good);stroke-dasharray:4 4;stroke-width:1.5}
.c-goal-l{fill:var(--good);font:750 11px var(--f-body)}
.c-proj{stroke:var(--accent);stroke-dasharray:3 5;stroke-width:2;fill:none;opacity:.7}
.c-end{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.c-dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.c-dot.photo{fill:var(--surface);stroke:var(--accent);stroke-width:2.2}
.c-x{stroke:var(--ink-3);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:6px 9px;font-size:12px;font-weight:700;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity 120ms ease}
.tip.show{opacity:1}
.hist{display:grid;gap:0;margin-top:8px}
.hist .between{padding:11px 2px;border-bottom:1px solid var(--line);font-size:14px}
.hist .between:last-child{border-bottom:0}
.hist .num{font-size:20px}
/* photo check-ins: three angle slots, a before/after slider, a strip of past check-ins */
.shots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.shot{position:relative;aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;color:var(--ink-3);transition:transform 140ms var(--ease-out)}
.shot:active{transform:scale(.97)}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot .pose{width:56%;height:auto;margin-bottom:22px;opacity:.75}
.shot .lab{position:absolute;left:6px;right:6px;bottom:6px;font-size:11.5px;font-weight:750;text-align:center;padding:4px 0;border-radius:9px;background:var(--surface);color:var(--ink-2)}
.shot.on .lab{background:rgba(8,10,24,.62);color:#fff}
.shot .ok{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.shot .ok svg{width:13px;height:13px}
.pose path,.pose circle{fill:none;stroke:currentColor;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.tips summary{cursor:pointer;font-weight:750;font-size:14px;color:var(--accent);list-style:none;display:flex;align-items:center;gap:6px}
.tips summary::-webkit-details-marker{display:none}
.tips summary svg{width:16px;height:16px;transition:transform 200ms var(--ease-out)}
.tips[open] summary svg{transform:rotate(90deg)}
.tips ul{margin:8px 0 0;padding-left:18px;display:grid;gap:5px;font-size:13.5px;color:var(--ink-2)}
.cmp-pick{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.field select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.cmp{position:relative;aspect-ratio:3/4;border-radius:18px;overflow:hidden;background:var(--surface-2);touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:ew-resize}
.cmp-img{position:absolute;inset:0}
.cmp-img img,.strip .ph img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.cmp-img.after{clip-path:inset(0 0 0 50%)}
.cmp-bar{position:absolute;inset:0;pointer-events:none;transform:translateX(50%)}
.cmp-bar::before{content:"";position:absolute;top:0;bottom:0;left:-1.5px;width:3px;background:#fff;box-shadow:0 0 0 1px rgba(8,10,24,.18)}
.cmp-bar i{position:absolute;top:50%;left:0;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:#fff;color:#0f1226;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(8,10,24,.3);transition:transform 140ms var(--ease-out)}
.cmp.drag .cmp-bar i{transform:scale(1.08)}
.cmp-bar i svg{width:15px;height:15px}
.cmp-tag{position:absolute;top:10px;padding:4px 9px;border-radius:9px;background:rgba(8,10,24,.62);color:#fff;font-size:12px;font-weight:750;pointer-events:none}
.cmp-tag.l{left:10px}.cmp-tag.r{right:10px}
.cmp .missing{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-3);font-size:13px;font-weight:650;text-align:center;padding:20px}
.cmp-stats{display:flex;flex-wrap:wrap;gap:6px}
.strip{display:flex;gap:10px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:none;width:84px;display:grid;gap:3px;text-align:left;scroll-snap-align:start;transition:transform 140ms var(--ease-out)}
.strip button:active{transform:scale(.96)}
.strip .ph{display:block;aspect-ratio:3/4;border-radius:13px;overflow:hidden;background:var(--surface-2)}
.strip b{font-size:12.5px}.strip span.w{font-size:12px;color:var(--ink-3)}
.strip button[aria-current="true"] .ph{box-shadow:0 0 0 2.5px var(--accent)}
.check-pics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.check-pics figure{margin:0;display:grid;gap:4px;font-size:12px;font-weight:700;color:var(--ink-3);text-align:center}
.check-pics .ph{display:block;aspect-ratio:3/4;border-radius:13px;overflow:hidden;background:var(--surface-2)}
.check-pics .ph img{width:100%;height:100%;object-fit:cover;display:block}
.mo-say{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:18px;background:var(--accent-soft)}
.mo-say .txt{font-size:14.5px;min-width:0}.mo-say .txt ul{margin:4px 0 0;padding-left:18px;display:grid;gap:4px}.mo-say .txt p+p{margin-top:6px}

/* guided camera: full screen, dark, the live view framed by a pose outline */
.cam{position:fixed;inset:0;z-index:70;background:#05060d;color:#fff;display:flex;flex-direction:column;opacity:0;transition:opacity 200ms ease}
.cam.open{opacity:1}
.cam-top,.cam-bot{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.cam-top{padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px}
.cam-bot{padding-top:14px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.cam-title{text-align:center;display:grid;gap:1px}
.cam-title b{font-family:var(--f-display);font-stretch:116%;font-size:17px;font-weight:760}
.cam-title span{font-size:12px;color:rgba(255,255,255,.65);font-weight:650}
.cam .iconbtn{background:rgba(255,255,255,.12);color:#fff}
.cam .iconbtn[aria-pressed="true"]{background:#fff;color:#05060d}
.cam-stage{position:relative;flex:1;min-height:0;margin:0 max(10px,env(safe-area-inset-left,0px));border-radius:22px;overflow:hidden;background:#11131f}
.cam-stage video,.cam-stage .cam-ghost,.cam-stage .cam-shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam-stage.mirror video,.cam-stage.mirror .cam-ghost{transform:scaleX(-1)}
.cam-ghost{opacity:.32;pointer-events:none}
.cam-guide{position:absolute;left:50%;top:6%;height:88%;width:auto;transform:translateX(-50%);pointer-events:none;color:#fff;opacity:.85;filter:drop-shadow(0 0 3px rgba(0,0,0,.6))}
.cam-guide path,.cam-guide circle{fill:none;stroke:currentColor;stroke-width:1.1;stroke-dasharray:3 2.5;stroke-linecap:round;stroke-linejoin:round}
.cam-guide line{stroke:var(--hi);stroke-width:.8;stroke-dasharray:1.5 2.5}
.cam-ghost[hidden]{display:none}
.cam-hint{position:absolute;left:12px;right:12px;bottom:12px;text-align:center;font-size:13.5px;font-weight:650;padding:9px 12px;border-radius:14px;background:rgba(5,6,13,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.cam-count{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-stretch:62%;font-weight:850;font-size:150px;line-height:1;text-shadow:0 4px 30px rgba(0,0,0,.5);pointer-events:none}
.cam-count.tick{animation:camTick 900ms var(--ease-out) both}
@keyframes camTick{from{opacity:0;transform:scale(1.25)}25%{opacity:1;transform:scale(1)}to{opacity:.85;transform:scale(.96)}}
.cam-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.cam-flash.go{animation:camFlash 260ms ease-out}
@keyframes camFlash{from{opacity:.85}to{opacity:0}}
.shutter{width:76px;height:76px;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 4px #fff;display:grid;place-items:center;transition:transform 140ms var(--ease-out)}
.shutter::after{content:"";width:60px;height:60px;border-radius:50%;background:#fff;transition:transform 160ms var(--ease-out),border-radius 160ms var(--ease-out),background 160ms ease}
.shutter:active{transform:scale(.94)}
.shutter.counting::after{transform:scale(.5);border-radius:10px;background:var(--bad)}
.timer{display:flex;gap:4px;background:rgba(255,255,255,.12);border-radius:13px;padding:3px}
.timer button{min-width:38px;height:34px;border-radius:10px;font-size:13px;font-weight:750;color:rgba(255,255,255,.8)}
.timer button[aria-pressed="true"]{background:#fff;color:#05060d}
.cam-side{flex:1;min-width:0;display:flex}
.cam-side.r{justify-content:flex-end}
.cam-fb{flex:1;overflow-y:auto;display:grid;align-content:center;justify-items:center;gap:14px;text-align:center;padding:10px max(22px,env(safe-area-inset-left,0px)) 10px max(22px,env(safe-area-inset-right,0px))}
.cam-fb .pose{width:92px;color:rgba(255,255,255,.85)}
.cam-fb p{color:rgba(255,255,255,.75);font-size:14.5px;max-width:36ch}
.cam-fb .btn{width:min(320px,100%)}
.cam-fb .btn.ghost{background:rgba(255,255,255,.12);color:#fff}
.cam-review{display:flex;gap:10px;width:100%}
.cam-review .btn{flex:1}
.cam-review .btn.ghost{background:rgba(255,255,255,.12);color:#fff}
.scan-res .range{position:relative;height:16px;border-radius:8px;background:var(--surface-2);margin:18px 0 6px}
.scan-res .range i{position:absolute;top:0;bottom:0;border-radius:8px;background:var(--accent-soft)}
.scan-res .range b{position:absolute;top:-4px;width:4px;height:24px;border-radius:2px;background:var(--accent);transform:translateX(-50%)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink-2)}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin-top:1px}

/* ---------- Food ---------- */
.daynav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.daynav h2{font-size:20px;text-align:center;flex:1}
.snapcta{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:16px;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);transition:transform 140ms var(--ease-out)}
.snapcta:active{transform:scale(.98)}
.snapcta .ic{width:52px;height:52px;border-radius:17px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.snapcta .ic svg{width:28px;height:28px}
.snapcta b{display:block;font-family:var(--f-display);font-stretch:116%;font-size:18px}
.snapcta span{font-size:13.5px;opacity:.85}
.meal h3{font-size:17px}
.food-list{list-style:none;padding:0;margin:8px 0 0;display:grid}
.food-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.food-row:last-child{border-bottom:0}
.food-row .nm{min-width:0}
.food-row .nm b{display:block;font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.food-row .nm span{font-size:12.5px;color:var(--ink-3)}
.food-row .kc{font-variant-numeric:tabular-nums;font-weight:750;font-size:14.5px;white-space:nowrap}
.rm{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--ink-3);transition:opacity 150ms ease,background 150ms ease}
.rm svg{width:16px;height:16px}
.rm:active{background:var(--surface-2)}
.addrow{display:flex;align-items:center;gap:8px;margin-top:8px;color:var(--accent);font-weight:750;font-size:14px;padding:6px 0}
.addrow svg{width:18px;height:18px}
.results{list-style:none;padding:0;margin:10px 0 0;display:grid;max-height:46dvh;overflow:auto;overscroll-behavior:contain}
.results button{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line);font-size:14.5px;min-width:0}
.results button span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:650}
.results button span:last-child{color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.mealpick{display:flex;gap:6px;flex-wrap:wrap}
.mealpick button{padding:8px 12px;border-radius:12px;background:var(--surface-2);font-weight:700;font-size:13.5px;transition:background 150ms ease,color 150ms ease}
.mealpick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.portion{display:flex;align-items:center;gap:10px}
.portion input{text-align:center;width:90px;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:750}
.mini-mac{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.mini-mac div{background:var(--surface-2);border-radius:12px;padding:8px 4px}
.mini-mac b{display:block;font-family:var(--f-display);font-stretch:62%;font-size:22px;font-weight:800}
.mini-mac span{font-size:11px;font-weight:700;color:var(--ink-3)}
.ai-items{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.ai-items li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--surface-2);border-radius:14px;padding:10px 12px}
.ai-items input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.ai-items .g{width:74px;min-height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);text-align:center;font-weight:700}
.ai-items .nm b{display:block;font-size:14px}
.ai-items .nm span{font-size:12px;color:var(--ink-3)}
.thinking{display:flex;align-items:center;gap:12px;padding:16px;border-radius:18px;background:var(--surface-2);font-size:14.5px;font-weight:650}
.dots{display:inline-flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:dot 1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.preview{border-radius:18px;overflow:hidden;max-height:240px;display:grid;place-items:center;background:var(--surface-2)}
.preview img{width:100%;max-height:240px;object-fit:cover}

/* ---------- Train ---------- */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:grid;gap:3px;justify-items:center;padding:9px 0 8px;border-radius:15px;background:var(--surface);box-shadow:var(--shadow);font-size:11px;font-weight:750;color:var(--ink-3);transition:transform 140ms var(--ease-out),background 200ms ease,color 200ms ease}
.wd:active{transform:scale(.94)}
.wd b{font-family:var(--f-display);font-stretch:62%;font-size:20px;color:var(--ink);font-weight:800}
.wd i{width:6px;height:6px;border-radius:50%;background:transparent}
.wd.train i{background:var(--accent)}
.wd.done i{background:var(--good)}
.wd[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.wd[aria-pressed="true"] b{color:var(--accent-ink)}
.wd[aria-pressed="true"].train i{background:var(--accent-ink)}
.wd.today b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.ex{display:grid;gap:10px}
.ex-head{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-width:0}
.ex-num{flex:none;width:34px;height:34px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-stretch:62%;font-weight:800;font-size:19px}
.ex-head .nm{flex:1;min-width:0}
.ex-head .nm b{display:block;font-size:15.5px;line-height:1.25}
.ex-head .nm span{font-size:13px;color:var(--ink-3)}
.ex-head svg{width:18px;height:18px;color:var(--ink-3);flex:none}
.sets{display:flex;gap:7px;flex-wrap:wrap;padding-left:46px}
.setdot{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--ink-3);transition:transform 140ms var(--ease-out),background 200ms ease,color 200ms ease,box-shadow 200ms ease}
.setdot:active{transform:scale(.88)}
.setdot.on{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.setdot.pop{animation:pop 320ms var(--ease-out)}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.howto ol{margin:6px 0 0;padding-left:20px;display:grid;gap:7px;font-size:14.5px}
.howto ul{margin:6px 0 0;padding-left:18px;display:grid;gap:5px;font-size:14.5px}
.tempo{background:var(--surface-2);border-radius:18px;padding:14px}
.tempo-track{position:relative;height:120px;margin-top:10px;border-radius:14px;background:var(--surface);overflow:hidden}
.tempo-track .lane{position:absolute;right:34px;top:14px;bottom:14px;width:4px;border-radius:2px;background:var(--line)}
.tempo-ball{position:absolute;right:23px;top:14px;width:26px;height:26px;border-radius:50%;background:var(--accent);box-shadow:0 4px 12px -2px var(--accent)}
.tempo-lab{position:absolute;left:14px;top:12px;right:72px;font-family:var(--f-display);font-stretch:62%;font-weight:800;font-size:28px;line-height:1}
.tempo-lab small{display:block;font-family:var(--f-body);font-size:12px;font-weight:750;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.tempo-key{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;text-align:center;font-size:11.5px;font-weight:700;color:var(--ink-3)}
.tempo-key b{display:block;font-family:var(--f-display);font-stretch:62%;font-size:22px;color:var(--ink)}

/* ---------- Coach ---------- */
.coach-head{display:flex;gap:14px;align-items:center}
.msgs{display:grid;gap:10px;align-content:start}
.msg{max-width:88%;padding:11px 14px;border-radius:19px;font-size:15px;line-height:1.5;min-width:0;overflow-wrap:anywhere}
.msg.u{justify-self:end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px}
.msg.a{justify-self:start;background:var(--surface);box-shadow:var(--shadow);border-bottom-left-radius:6px}
.msg.a p+p,.msg.a p+ul,.msg.a ul+p{margin-top:8px}
.msg.a ul{margin:6px 0 0;padding-left:18px;display:grid;gap:4px}
.msg.a .note{margin-top:8px;font-size:12.5px;color:var(--bad);font-weight:650}
.msg-row{display:flex;gap:8px;align-items:flex-end}
.sugg{display:flex;gap:8px;flex-wrap:wrap}
.sugg button{padding:9px 13px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);font-size:13.5px;font-weight:650;text-align:left;transition:transform 140ms var(--ease-out),box-shadow 150ms ease}
.sugg button:active{transform:scale(.97)}
.composer{position:sticky;bottom:calc(92px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end;background:var(--surface);border-radius:22px;padding:6px 6px 6px 16px;box-shadow:0 10px 30px -10px rgba(15,18,38,.25),0 0 0 1px var(--line);z-index:4}
.composer textarea{flex:1;border:0;background:transparent;resize:none;min-height:44px;max-height:140px;padding:11px 0;line-height:1.4;outline:none}
.composer .send{width:44px;height:44px;border-radius:15px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;transition:transform 140ms var(--ease-out)}
.composer .send:active{transform:scale(.92)}
.composer .send svg{width:20px;height:20px}

/* ---------- sheets, toast ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:40}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity 220ms ease}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:92%;display:flex;flex-direction:column;background:var(--bg);border-radius:28px 28px 0 0;transform:translateY(100%);transition:transform 240ms var(--ease-out);box-shadow:0 -12px 40px rgba(0,0,0,.2);padding-bottom:env(safe-area-inset-bottom,0px);outline:none}
.sheet-wrap.open .scrim{opacity:1}
.sheet-wrap.open .sheet{transform:translateY(0);transition:transform 420ms var(--ease-drawer)}
.sheet.dragging{transition:none!important}
.grab{flex:none;height:30px;display:grid;place-items:center;cursor:grab;touch-action:none}
.grab::before{content:"";width:44px;height:5px;border-radius:3px;background:var(--line)}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;padding:0 max(18px,env(safe-area-inset-left,0px)) 26px max(18px,env(safe-area-inset-right,0px));display:grid;gap:16px;align-content:start}
.sheet-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sheet-h h2{font-size:23px}
.toast{position:fixed;left:0;right:0;margin:0 auto;width:max-content;bottom:calc(98px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;gap:12px;align-items:center;max-width:min(440px,calc(100% - 32px));background:var(--ink);color:var(--bg);border-radius:16px;padding:11px 14px;font-weight:650;font-size:14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);transform:translateY(18px);opacity:0;pointer-events:none;transition:transform 260ms var(--ease-out),opacity 200ms ease}
.toast.show{transform:translateY(0);opacity:1;pointer-events:auto}
.toast button{color:var(--hi);font-weight:800}

/* ---------- onboarding ---------- */
.onboard{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;opacity:0;transition:opacity 260ms ease}
.onboard.open{opacity:1}
.ob-in{max-width:520px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(18px + env(safe-area-inset-bottom,0px))}
.ob-top{display:flex;align-items:center;gap:12px}
.ob-prog{flex:1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.ob-prog i{display:block;height:100%;width:100%;background:var(--accent);border-radius:4px;transform-origin:left;transition:transform 420ms var(--ease-out)}
.ob-stage{flex:1;display:grid;gap:18px;align-content:start;padding-top:22px}
.ob-stage.in-r{animation:obR 260ms var(--ease-out) both}
.ob-stage.in-l{animation:obL 260ms var(--ease-out) both}
@keyframes obR{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes obL{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.ob-q{font-size:30px}
.ob-sub{color:var(--ink-2);font-size:15.5px;max-width:42ch}
.ob-hero{display:flex;justify-content:flex-start}
.ob-foot{display:flex;gap:10px;padding-top:18px}
.ob-foot .btn{flex:1}
.choices{display:grid;gap:10px}
.choices.two{grid-template-columns:1fr 1fr}
.choice{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 15px;border-radius:18px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);transition:transform 140ms var(--ease-out),box-shadow 160ms ease,background 160ms ease;min-width:0}
.choice:active{transform:scale(.98)}
.choice[aria-pressed="true"]{box-shadow:inset 0 0 0 2.5px var(--accent);background:var(--accent-soft)}
.choice b{display:block;font-size:15.5px}
.choice span{display:block;font-size:13px;color:var(--ink-3)}
.choice .ck{margin-left:auto;width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;flex:none;color:transparent;transition:background 160ms ease,color 160ms ease,box-shadow 160ms ease}
.choice .ck svg{width:15px;height:15px}
.choice[aria-pressed="true"] .ck{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pills button{min-width:52px;min-height:46px;padding:0 14px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);font-weight:750;font-size:15px;transition:transform 140ms var(--ease-out),background 160ms ease,color 160ms ease}
.pills button:active{transform:scale(.95)}
.pills button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:48px;height:48px;border-radius:15px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);font-size:22px;font-weight:700;transition:transform 140ms var(--ease-out)}
.stepper button:active{transform:scale(.92)}
.stepper input{width:96px;min-height:48px;text-align:center;border-radius:15px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--f-display);font-stretch:62%;font-weight:800;font-size:26px}
.stepper .u{color:var(--ink-3);font-weight:700}
.tape{background:var(--surface);border-radius:20px;padding:12px 0 6px;box-shadow:var(--shadow);position:relative}
.tape-read{display:flex;align-items:baseline;justify-content:center;gap:6px}
.tape-read input{width:120px;text-align:center;border:0;background:transparent;font-family:var(--f-display);font-stretch:62%;font-weight:850;font-size:44px;line-height:1;padding:0;outline:none}
.tape-read input:focus-visible{outline:2px solid var(--accent);border-radius:8px}
.tape-read .u{font-weight:750;color:var(--ink-3)}
.tape-track{position:relative;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;padding-inline:50%;cursor:grab;touch-action:pan-x;-webkit-mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent)}
.tape-track::-webkit-scrollbar{display:none}
.tape-scale{position:relative;height:58px;background:linear-gradient(90deg,var(--ink-3) 1px,transparent 1px) 0 0/var(--tk) 13px repeat-x,linear-gradient(90deg,var(--ink) 2px,transparent 2px) 0 0/calc(var(--tk)*var(--mj)) 24px repeat-x}
.tape-scale span{position:absolute;top:30px;transform:translateX(-50%);font-size:12px;font-weight:750;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tape-needle{position:absolute;left:50%;bottom:36px;height:34px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--accent);pointer-events:none}
.tape-needle::before{content:"";position:absolute;top:-6px;left:50%;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:var(--accent)}
.buildlist{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.buildlist li{display:flex;gap:12px;align-items:center;font-size:15px;font-weight:650;opacity:.3;transition:opacity 260ms ease}
.buildlist li.on{opacity:1}
.buildlist li i{width:28px;height:28px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none;color:transparent;transition:background 200ms ease,color 200ms ease}
.buildlist li.on i{background:var(--accent);color:var(--accent-ink);animation:pop 320ms var(--ease-out)}
.buildlist li i svg{width:15px;height:15px}
.buildlist li small{display:block;font-weight:600;color:var(--ink-3);font-size:12.5px}
.reveal-num{font-size:82px;line-height:.85}
.welcome{display:grid;gap:18px;padding-top:12px}
.welcome .hero{display:flex;align-items:flex-end;gap:6px}
.welcome .hero .hand{font-size:26px;transform:rotate(-6deg);margin-bottom:58px}
.welcome h1{font-size:36px;font-stretch:120%}
.feat{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.feat li{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);font-size:14.5px}
.feat li .ic{width:38px;height:38px;border-radius:13px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}

.feat li b{display:block}
.splash{min-height:60dvh;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center}
.shake{animation:shake 320ms var(--ease-out)}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

function navyBF(sex, h, waist, neck, hip) {
  if (!h || !waist || !neck) return null;
  if (sex === 'm') {
    if (waist <= neck) return null;
    return 495 / (1.0324 - 0.19077 * Math.log10(waist - neck) + 0.15456 * Math.log10(h)) - 450;

  if (!hip || waist + hip <= neck) return null;
  return 495 / (1.29579 - 0.35004 * Math.log10(waist + hip - neck) + 0.22100 * Math.log10(h)) - 450;
}
function latestTape(p, weights) {

}

  bf = clamp(bf, male ? 3 : 9, 60);
  const lbm = w * (1 - bf / 100), fm = w - lbm;
  const ffmi = lbm / (hm * hm), nffmi = ffmi + 6.1 * (1.8 - hm);

function dayTotals(d) {
  const t = { kcal: 0, p: 0, c: 0, f: 0, n: 0 };
  if (!d || !d.food) return t;

  return t;
}

// Recalibrate the daily burn from real intake and weight change (energy balance).
function adaptiveTdee() {

  const ws = S.weights.filter(e => e.d >= start && e.d <= end);
  if (logged.length < 10 || ws.length < 6) return null;
  const span = daysBetween(ws[0].d, ws[ws.length - 1].d);
  if (span < 14) return null;
  const n = Math.min(3, Math.floor(ws.length / 2));
  const avg = a => a.reduce((s, e) => s + e.w, 0) / a.length;
  const dW = avg(ws.slice(-n)) - avg(ws.slice(0, n));
  const intake = logged.reduce((s, [, d]) => s + dayTotals(d).kcal, 0) / logged.length;

function targets(p, st) {

  const tdee = st.adaptive || st.tdee;
  let kcal = tdee, weekly = 0;
  const highBf = st.bf > (male ? 25 : 32);
  if (p.goal === 'lose' || (p.goal === 'health' && st.bmi >= 27)) {
    const rate = p.goal === 'health' ? 0.5 : (highBf ? 0.8 : 0.6);
    let deficit = (st.w * rate / 100) * 7700 / 7;
    deficit = Math.min(deficit, tdee * 0.25);
    kcal = tdee - deficit;
  } else if (p.goal === 'gain') {
    kcal = tdee * (1 + EXP[p.exp].surplus);
    weekly = st.w * EXP[p.exp].gainPctMonth / 100 / 4.345;
  } else if (p.goal === 'recomp') {
    kcal = tdee * 0.93;
  } else if (p.goal === 'strength') {
    kcal = tdee * 1.05;
    weekly = st.w * 0.0015;
  }
  const floor = male ? 1500 : 1200;
  if (kcal < floor) kcal = floor;
  if (kcal < tdee) weekly = -(tdee - kcal) * 7 / 7700;
  if (p.goal === 'recomp') weekly = weekly * 0.5;
  kcal = Math.round(kcal / 10) * 10;
  const gkg = { lose: 2.0, gain: 1.8, recomp: 2.0, health: 1.4, strength: 1.8 }[p.goal];
  const refW = st.bmi > 30 ? 25 * (p.height / 100) ** 2 : st.w;
  const protein = Math.round(gkg * refW / 5) * 5;
  const fat = Math.round(Math.max(0.6 * st.w, kcal * 0.27 / 9));
  const carbs = Math.max(40, Math.round((kcal - protein * 4 - fat * 9) / 4));
  const fiber = Math.round(kcal / 1000 * 14);
  const waterL = (male ? 2.0 : 1.6) + 0.5;
  const waterGlasses = Math.round(waterL / 0.25);
  const steps = p.age >= 60 ? 7000 : (p.goal === 'lose' || p.goal === 'health' || p.job === 'desk') ? 9000 : 8000;
  return { kcal, protein, carbs, fat, fiber, weekly, waterGlasses, steps, gkg, tdeeUsed: tdee, refW };
}

function journey(p, st, tg) {
  const start = S.weights.length ? S.weights[0].w : p.weight;
  const startDate = S.weights.length ? S.weights[0].d : (p.created || todayKey());
  const cur = st.w, target = p.target;
  const out = { start, startDate, cur, target, eta: null, progress: 0, reached: false, mismatch: false };
  if (!target || p.goal === 'recomp' || p.goal === 'strength') return out;
  const total = target - start, left = target - cur;
  out.total = total; out.left = left; out.done = cur - start;
  out.progress = total ? clamp((cur - start) / total, 0, 1) : 1;
  if (Math.abs(left) < 0.25 || (total && Math.sign(left) !== Math.sign(total))) { out.reached = true; out.progress = 1; return out; }
  if (!tg.weekly || Math.sign(left) !== Math.sign(tg.weekly)) { out.mismatch = true; return out; }
  const weeks = left / tg.weekly;
  out.weeks = weeks;
  out.eta = addDays(todayKey(), Math.ceil(weeks * 7));
  if (p.targetDate && p.targetDate > todayKey()) {
    const wk = daysBetween(todayKey(), p.targetDate) / 7;
    const need = Math.abs(left) / wk;
    const safe = cur * (left < 0 ? 0.01 : 0.005);
    out.needWeekly = need; out.safeWeekly = safe; out.feasible = need <= safe * 1.02;
  }
  return out;
}

function scheme(p, ex) {
  let sets = 3, reps = ex.compound ? '6–10' : '10–15', rir = '1–2', rest = ex.compound ? '2–3 min' : '60–90 s';
  if (p.goal === 'strength' && ex.compound && ['squat', 'hinge', 'hpush', 'vpush'].includes(ex.pat)) { sets = 4; reps = '4–6'; rir = '2'; rest = '3 min'; }
  if (p.goal === 'health') { reps = ex.compound ? '8–12' : '12–15'; rir = '2–3'; }
  if (p.exp === 'new') { sets = Math.max(2, sets - 1); rir = '2–3'; }
  if (ex.reps) reps = ex.reps;
  if (ex.pat === 'calves') reps = '10–15';
  return { sets, reps, rir, rest };
}
function canDo(ex, p) {
  const eqOk = p.equip === 'gym' ? true : p.equip === 'db' ? ex.eq.some(e => e === 'db' || e === 'bw') : ex.eq.includes('bw');
  return eqOk && !ex.avoid.some(i => (p.injuries || []).includes(i));
}
function buildPlan(p) {
  const split = SPLITS[p.days]; const used = {};
  const sessions = split.sessions.map(([name, pats]) => {
    const items = [];
    for (const pat of pats) {
      // Prefer moves that use the person's own equipment (e.g. a dumbbell pullover over a pull-up when there's no bar).
      const cands = LIB.filter(ex => ex.pat === pat && canDo(ex, p)).sort((a, b) => (a.eq.includes(p.equip) ? 0 : 1) - (b.eq.includes(p.equip) ? 0 : 1));
      if (!cands.length) continue;
      const n = used[pat] || 0; used[pat] = n + 1;
      const ex = cands[n % Math.min(cands.length, 2)];
      if (items.some(it => it.ex.id === ex.id)) continue;
      items.push({ ex, ...scheme(p, ex) });
    }

}
function sessionFor(k, plan) {
  const i = plan.weekdays.indexOf(parseKey(k).getDay());
  return i < 0 ? null : { idx: i, ...plan.sessions[i] };
}

function derive(profile = S.profile) {
  const p = profile; if (!p) return null;
  const st = bodyStats(p, S.weights);
  st.adaptive = adaptiveTdee();
  const tg = targets(p, st);
  const jr = journey(p, st, tg);
  const plan = buildPlan(p);

}

function strategy(D) {

const Eyes = { x: 0, y: 0, raf: 0 };
function eyeTick() {
  Eyes.raf = 0; let moving = false;
  $$('.mo').forEach(m => {
    if (m.dataset.mood === 'think') return;

    if (!r.width || r.bottom < 0 || r.top > innerHeight) return;
    const dx = Eyes.x - (r.left + r.width / 2), dy = Eyes.y - (r.top + r.height * 0.46);
    const d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 260);

function md(text) {

  let html = '', inList = false, para = [];
  const flush = () => { if (para.length) { html += `<p>${para.join('<br>')}</p>`; para = []; } };
  for (const raw of lines) {
    const line = raw.trim();
    const li = line.match(/^(?:[-•]|\d+[.)])\s+(.*)$/);
    if (li) { flush(); if (!inList) { html += '<ul>'; inList = true; } html += `<li>${li[1]}</li>`; continue; }
    if (inList) { html += '</ul>'; inList = false; }
    if (!line) { flush(); continue; }
    para.push(line.replace(/^#+\s*/, ''));
  }

  return html;
}

  mem: new Map(), idb: null,
  ref(id) { return Store.db.doc(`data/users/${Store.uid}/gallery`).collection('shots').doc(id); },
  open() {
    if (!this.idb) this.idb = new Promise(res => {
      try {
        const r = indexedDB.open('forma-photos', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('shots');
        r.onsuccess = () => res(r.result); r.onerror = r.onblocked = () => res(null);
      } catch (e) { res(null); }
    });
    return this.idb;
  },
  async local(mode, fn) {
    const db = await this.open(); if (!db) return undefined;
    return new Promise(res => {
      try { const t = db.transaction('shots', mode), req = fn(t.objectStore('shots')); t.oncomplete = () => res(req.result); t.onerror = t.onabort = () => res(undefined); }
      catch (e) { res(undefined); }
    });
  },
  async get(id) {
    if (this.mem.has(id)) return this.mem.get(id);
    let v = null;
    if (!S.example) {
      if (Store.mode === 'cloud') { try { const s = await this.ref(id).get(); if (s.exists) v = s.data().src || null; } catch (e) { /* try this browser */ } }
      if (!v) v = (await this.local('readonly', st => st.get(id))) || null;
    }
    if (v) this.mem.set(id, v);
    return v;
  },
  async put(id, src) {
    this.mem.set(id, src);
    if (S.example) return true;
    if (Store.mode === 'cloud') {
      try { await this.ref(id).set({ src }); return true; }
      catch (e) { if (e && e.code === 'quota_exceeded') { this.mem.delete(id); toast('Your photo space is full. Delete an old check-in to make room.'); return false; } }
    }
    if (await this.local('readwrite', st => st.put(src, id)) !== undefined) return true;
    this.mem.delete(id); return false;
  },
  async del(id) {
    this.mem.delete(id);
    if (S.example) return;
    if (Store.mode === 'cloud') { try { await this.ref(id).delete(); } catch (e) { /* ignore */ } }
    await this.local('readwrite', st => st.delete(id));
  },
};

async function decodeImage(blob) {
  if (window.createImageBitmap) { try { return await createImageBitmap(blob, { imageOrientation: 'from-image' }); } catch (e) { /* older browsers */ } }
  const url = URL.createObjectURL(blob), img = new Image();
  img.src = url;
  try { await img.decode(); } finally { setTimeout(() => URL.revokeObjectURL(url), 1000); }
  return img;
}
function frameTo(src, w, h, maxEdge) {
  const k = Math.min(1, maxEdge / Math.max(w, h)), c = document.createElement('canvas');
  c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return c;
}
const jpeg = (c, q) => new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('encode')), 'image/jpeg', q));
// A camera frame or picked file becomes a 1600 px JPEG for Mo, plus a URL to show it.
async function prepShot(src, w, h) { const blob = await jpeg(frameTo(src, w, h, 1600), 0.86); return { blob, url: URL.createObjectURL(blob) }; }
async function prepFile(file) {
  const img = await decodeImage(file);
  const shot = await prepShot(img, img.naturalWidth || img.width, img.naturalHeight || img.height);
  if (img.close) img.close();
  return shot;
}
// The kept copy has to fit one database document (256 KB), so it steps down until it does.
async function keepCopy(blob) {
  const img = await decodeImage(blob), w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  let out = '';
  for (const [edge, q] of [[1000, 0.74], [900, 0.62], [720, 0.56]]) { out = frameTo(img, w, h, edge).toDataURL('image/jpeg', q); if (out.length < 235000) break; }
  if (img.close) img.close();
  return out;
}

  const [head, b64] = src.split(','), bin = atob(b64), a = new Uint8Array(bin.length);

}

function galleryHTML(D) {
  const L = S.photos;
  if (!L.length) return `<section class="card stack"><span class="label">Progress photos</span><p class="empty">Your check-ins line up here. Once you have two, a before-and-after slider shows what changed.</p></section>`;
  if (!checkById(Cmp.b)) Cmp.b = L[L.length - 1].id;
  if (!checkById(Cmp.a) || Cmp.a === Cmp.b) Cmp.a = (L.find(c => c.id !== Cmp.b) || L[0]).id;
  let body;
  if (L.length > 1) {
    const A = checkById(Cmp.a), B = checkById(Cmp.b);
    const common = ANGLES.filter(([a]) => A.angles.includes(a) && B.angles.includes(a));
    if (!common.some(([a]) => a === Cmp.angle)) Cmp.angle = (common[0] || ANGLES[0])[0];

    const weeks = Math.round(Math.abs(daysBetween(A.d, B.d)) / 7);

    const sign = v => (v > 0 ? '+' : v < 0 ? '−' : '±') + fmt(Math.abs(v), 1);
    const good = v => S.profile.goal === 'gain' ? v > 0 : ['lose', 'recomp'].includes(S.profile.goal) ? v < 0 : false;
    body = `<div class="cmp-pick"><label class="field"><span class="label">Before</span><select id="cmpA">${opt(Cmp.a, Cmp.b)}</select></label><label class="field"><span class="label">After</span><select id="cmpB">${opt(Cmp.b, Cmp.a)}</select></label></div>
    ${common.length > 1 ? segCtl('cmp', common, Cmp.angle) : ''}
    ${common.length ? `<div class="cmp" id="cmp" role="slider" tabindex="0" aria-label="Before and after. Drag, or use the arrow keys." aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(Cmp.x)}">
      <div class="cmp-img" data-pic="${A.id}-${Cmp.angle}"></div><div class="cmp-img after" data-pic="${B.id}-${Cmp.angle}"></div>
      <span class="cmp-tag l">${fmtDate(A.d)}</span><span class="cmp-tag r">${fmtDate(B.d)}</span>
      <span class="cmp-bar"><i>${ico.left}${ico.right}</i></span></div>` : '<p class="empty">These two check-ins don\'t share an angle. Pick another pair.</p>'}
    <div class="cmp-stats"><span class="chip">${weeks ? `${weeks} week${weeks === 1 ? '' : 's'} apart` : 'Same week'}</span>${dw != null ? `<span class="chip${good(dw) ? ' good' : ''}">${sign(dw)} kg</span>` : ''}${dbf != null ? `<span class="chip${dbf < 0 ? ' good' : ''}">${sign(dbf)}% body fat</span>` : ''}</div>
    ${AI.on && AI.images && !S.example && common.length ? (Cmp.busy ? thinkingRow('Mo is comparing your check-ins', 'cmpStop') : `<button class="btn line block" data-act="cmpAsk">${ico.spark} Ask Mo what changed</button>`) : ''}
    ${Cmp.ai ? (Cmp.ai.error ? `<p class="err">${esc(Cmp.ai.error)}</p>` : `<div class="mo-say">${mo('sm', 'happy')}<div class="txt">${md(Cmp.ai.text)}</div></div>`) : ''}`;

  return `<section class="card stack"><div><span class="label">Progress photos</span><h2 style="margin-top:4px">${L.length} check-in${L.length === 1 ? '' : 's'}</h2></div>

  </section>`;
}

// Fills [data-pic] holders; cached shots land before the first paint, so re-renders don't flash.
function hydratePics(root = document) {
  $$('[data-pic]', root).forEach(el => {
    if (el.dataset.loaded) return; el.dataset.loaded = '1';
    const id = el.dataset.pic;
    const put = src => {
      if (!src) { if (el.classList.contains('cmp-img')) el.innerHTML = '<span class="missing">This photo isn\'t on this device.</span>'; return; }
      const img = new Image(); img.alt = ''; img.decoding = 'async'; img.draggable = false; img.src = src; el.replaceChildren(img);
    };
    if (Pics.mem.has(id)) put(Pics.mem.get(id)); else Pics.get(id).then(put);
  });
}
function initCompare(el) {
  const after = el.querySelector('.after'), bar = el.querySelector('.cmp-bar');
  const set = x => {
    Cmp.x = clamp(x, 0, 100);
    after.style.clipPath = `inset(0 0 0 ${Cmp.x}%)`; bar.style.transform = `translateX(${Cmp.x}%)`;
    el.setAttribute('aria-valuenow', Math.round(Cmp.x)); el.setAttribute('aria-valuetext', `${Math.round(100 - Cmp.x)}% after showing`);
  };
  set(Cmp.x);
  let id = null, x0 = 0, moved = false;
  const at = e => { const r = el.getBoundingClientRect(); set((e.clientX - r.left) / r.width * 100); };
  el.addEventListener('pointerdown', e => {
    if (id !== null) return; id = e.pointerId; x0 = e.clientX; moved = false;
    try { el.setPointerCapture(id); } catch (err) { /* ignore */ }
    el.classList.add('drag'); if (e.pointerType === 'mouse') at(e);
  });
  el.addEventListener('pointermove', e => { if (e.pointerId !== id) return; if (Math.abs(e.clientX - x0) > 3) moved = true; if (moved || e.pointerType === 'mouse') at(e); });
  const end = e => { if (e.pointerId !== id) return; if (e.type === 'pointerup' && !moved) at(e); id = null; el.classList.remove('drag'); };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  el.addEventListener('keydown', e => {
    const d = { ArrowLeft: -5, ArrowRight: 5, Home: -100, End: 100 }[e.key];
    if (d) { e.preventDefault(); set(Cmp.x + d); }
  });
}

async function saveCheckIn() {
  const angles = ANGLES.map(([a]) => a).filter(a => Scan.shots[a]);
  if (Scan.saving || !angles.length) return;
  const k = todayKey(), w = round(derive().st.w, 1), est = Scan.result && !Scan.result.error ? Scan.result.estimate : null;
  Scan.saving = true; render(false);
  if (est != null) {
    let e = S.weights.find(x => x.d === k);
    if (!e) { e = { d: k, w }; S.weights.push(e); S.weights.sort((a, b) => a.d < b.d ? -1 : 1); }
    e.bfPhoto = round(est, 1); saveWeights();
  }
  const saved = [];
  if (Scan.keep) {
    toast('Saving your photos…', { ms: 9000 });
    for (const a of angles) {
      try { if (await Pics.put(`${k}-${a}`, await keepCopy(Scan.shots[a].blob))) saved.push(a); else break; }
      catch (e) { /* skip an angle that won't encode */ }
    }
    if (saved.length) {
      let c = checkById(k);
      if (!c) { c = { id: k, d: k, w, bf: null, angles: [] }; S.photos.push(c); S.photos.sort((x, y) => x.d < y.d ? -1 : 1); }
      c.w = w; if (est != null) c.bf = round(est, 1);
      c.angles = ANGLES.map(([a]) => a).filter(a => c.angles.includes(a) || saved.includes(a));
      savePhotos(); Cmp.b = k; Cmp.ai = null;
    }
  }
  Scan.saving = false; Scan.consent = false;
  const ok = saved.length || (est != null && !Scan.keep);
  if (ok) clearShots();
  render(false);
  toast(saved.length ? `Check-in saved with ${saved.length} photo${saved.length === 1 ? '' : 's'}.` : ok ? 'Photo estimate saved to your progress.' : 'Couldn\'t save the photos. Try again.');
}

/* ---------- Train ---------- */
function viewTrain(D) {
  const { plan, p } = D; const tk = todayKey();
  const sel = S.trainDay || tk;
  const monday = addDays(tk, -((parseKey(tk).getDay() + 6) % 7));
  const week = Array.from({ length: 7 }, (_, i) => addDays(monday, i));
  const sess = sessionFor(sel, plan);
  const d = day(sel);
  const strip = week.map(k => {
    const s = sessionFor(k, plan); const dd = S.days[k];
    const done = s && dd && s.items.every(it => (dd.done && dd.done[it.ex.id] || 0) >= it.sets);
    return `<button class="wd${s ? ' train' : ''}${done ? ' done' : ''}${k === tk ? ' today' : ''}" aria-pressed="${k === sel}" data-act="trainDay" data-k="${k}" aria-label="${fmtDate(k, { weekday: 'long' })}${s ? ', ' + s.name : ', rest'}"><span>${DOW[parseKey(k).getDay()]}</span><b>${parseKey(k).getDate()}</b><i></i></button>`;
  }).join('');
  const editable = sel === tk;
  let body;
  if (!sess) body = `<section class="card"><span class="label">${fmtDate(sel, { weekday: 'long' })}</span><h2 style="margin-top:4px">Rest and recover</h2><p class="muted small" style="margin-top:8px">Muscle grows between sessions. Go for an easy walk, stretch, and get your protein and sleep in.</p></section>`;
  else {
    const total = sess.items.reduce((s, it) => s + it.sets, 0);
    body = `<section class="between" style="padding:0 2px"><div><span class="label">${fmtDate(sel, { weekday: 'long' })} · ~${Math.round(total * 2.6 + 6)} min</span><h2 style="font-size:24px;margin-top:3px">${esc(sess.name)}</h2></div>${editable ? '' : '<span class="chip">Preview</span>'}</section>
    ${sess.items.map((it, n) => {
      const dn = d.done[it.ex.id] || 0;
      return `<section class="card ex"><button class="ex-head" data-act="exercise" data-id="${it.ex.id}" data-sets="${it.sets}" data-reps="${esc(it.reps)}" data-rir="${it.rir}" data-rest="${it.rest}"><span class="ex-num">${n + 1}</span><span class="nm"><b>${esc(it.ex.name)}</b><span>${it.sets} × ${esc(it.reps)} · ${it.rir} reps in reserve · rest ${it.rest}</span></span>${ico.info}</button>
      ${editable ? `<div class="sets" role="group" aria-label="Sets for ${esc(it.ex.name)}">${Array.from({ length: it.sets }, (_, i) => `<button class="setdot${i < dn ? ' on' : ''}" data-act="set" data-id="${it.ex.id}" data-i="${i}" data-sets="${it.sets}" aria-label="Set ${i + 1}${i < dn ? ', done' : ''}">${i + 1}</button>`).join('')}</div>` : ''}</section>`;
    }).join('')}`;
  }
  return `<div class="week">${strip}</div>${body}
  <section class="card"><div class="between"><span class="label">Your program</span><button class="link" data-act="trainInfo">How it works ${ico.right}</button></div>
  <p style="margin-top:6px"><b>${esc(plan.name)}</b> · ${p.days} days a week · ${esc(EQUIP[p.equip].label.toLowerCase())}${(p.injuries || []).length ? ` · adjusted for ${p.injuries.map(i => INJ[i].toLowerCase()).join(', ')}` : ''}</p></section>`;
}

/* =========================================================

const TABS = [['today', 'Today'], ['body', 'Body'], ['food', 'Food'], ['train', 'Train'], ['coach', 'Coach']];
function buildTabbar() {
  const inner = $('.tabbar-in');
  inner.insertAdjacentHTML('beforeend', TABS.map(([k, l]) => `<button class="tab" role="tab" data-act="tab" data-tab="${k}" aria-selected="false">${ico[k]}<span>${l}</span></button>`).join(''));
}
function syncChrome() {
  const has = !!S.profile;
  $('#tabbar').hidden = !has;
  $('#avatarBtn').hidden = !has;
  $('#exampleBanner').hidden = !S.example;
  if (has) {
    $('#avatarBtn').textContent = (S.profile.name || 'Me').trim().charAt(0).toUpperCase();
    const i = TABS.findIndex(t => t[0] === S.tab);
    $('#tabInd').style.setProperty('--ti', i);
    $$('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === S.tab)));
  }
  $('#topDate').textContent = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
}
let lastTab = null;
function render(enter = true) {
  const v = $('#view');
  syncChrome();
  if (!S.loaded) { v.innerHTML = viewSplash(); return; }
  if (!S.profile) { v.innerHTML = viewWelcome(); v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter'); stagger(v); return; }
  const D = derive();
  const fn = { today: viewToday, body: viewBody, food: viewFood, train: viewTrain, coach: viewCoach }[S.tab];
  const keepScroll = !enter;
  const y = scrollY;
  v.innerHTML = fn(D);
  if (enter && lastTab !== S.tab) { v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter'); stagger(v); scrollTo(0, 0); }
  else { v.classList.remove('enter'); if (keepScroll) scrollTo(0, y); }
  lastTab = S.tab;
  after(D);
}
function stagger(v) { [...v.children].forEach((c, i) => c.style.setProperty('--i', Math.min(i, 8))); }

function after(D) {
  // rings
  $$('[data-ring]').forEach(c => {
    const key = c.dataset.ring, to = +c.dataset.off, len = +c.dataset.len;
    const from = prev['ring:' + key] ?? len;
    if (!reduceMotion && from !== to) {
      c.style.transition = 'none'; c.style.strokeDashoffset = from; c.getBoundingClientRect();
      c.style.transition = 'stroke-dashoffset 760ms cubic-bezier(.23,1,.32,1)'; c.style.strokeDashoffset = to;
    }
    prev['ring:' + key] = to;
  });
  $$('[data-bar]').forEach(b => {
    const key = b.dataset.bar, to = +b.dataset.v, from = prev['bar:' + key] ?? 0;
    if (!reduceMotion && from !== to) {
      b.style.transition = 'none'; b.style.transform = `scaleX(${from})`; b.getBoundingClientRect();
      b.style.transition = 'transform 640ms cubic-bezier(.23,1,.32,1)'; b.style.transform = `scaleX(${to})`;
    }
    prev['bar:' + key] = to;
  });
  $$('[data-count]').forEach(el => {
    const key = el.dataset.ckey, to = +el.dataset.count, dec = +(el.dataset.dec || 0);
    const from = prev['n:' + key] ?? 0;
    prev['n:' + key] = to;
    if (reduceMotion || from === to) return;
    const suffix = el.querySelector('small') ? el.querySelector('small').outerHTML : '';
    const t0 = performance.now(), dur = 700;
    const step = now => {

function drawJourney(host, D) {

  const lo = Math.min(a, b), hi = Math.max(a, b), span = hi - lo;
  const minor = span > 30 ? 1 : 0.5, labEvery = span <= 6 ? 1 : span <= 14 ? 2 : span <= 30 ? 5 : 10;
  let ticks = '', labels = '';
  for (let v = Math.ceil(lo / minor) * minor; v <= hi + 1e-6; v = round(v + minor, 2)) {

    ticks += `<line class="t-tick${maj ? ' maj' : ''}" x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="38" y2="${maj ? 50 : 44}" stroke-width="${maj ? 1.4 : 1}"/>`;
    if (maj && Math.round(v) % labEvery === 0 && Math.abs(x - X(a)) > 14 && Math.abs(x - X(b)) > 14) labels += `<text class="t-lab" x="${x.toFixed(1)}" y="78" text-anchor="middle">${Math.round(v)}</text>`;
  }

  const svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress from ${fmt(a, 1)} kg to ${fmt(b, 1)} kg, now at ${fmt(cur, 1)} kg">
    <rect class="t-body" x="${x0 - 10}" y="36" width="${x1 - x0 + 20}" height="28" rx="9"/>
    <rect class="t-prog" x="${left.toFixed(1)}" y="36" width="${wid.toFixed(1)}" height="28" rx="9"/>

    <text class="t-lab" x="${xa.toFixed(1)}" y="91" text-anchor="middle">start</text>
    <line class="t-pole" x1="${X(b).toFixed(1)}" x2="${X(b).toFixed(1)}" y1="14" y2="64" stroke-width="1.6"/>
    <path class="t-flag" d="M${X(b).toFixed(1)} 14 h${b < a ? -16 : 16} l${b < a ? 4 : -4} 5 l${b < a ? -4 : 4} 5 h${b < a ? 16 : -16} Z"/>
    <text class="t-cap" x="${X(b).toFixed(1)}" y="78" text-anchor="middle">${fmt(b, 1)}</text>

    <text class="t-you" x="${(xc + (youRight ? 22 : -22)).toFixed(1)}" y="14" text-anchor="${youRight ? 'start' : 'end'}">you, ${fmt(cur, 1)}</text>
    <path class="t-arrow" d="M${(xc + (youRight ? 20 : -20)).toFixed(1)} 12 Q${(xc + (youRight ? 8 : -8)).toFixed(1)} 10 ${(xc + (youRight ? 5 : -5)).toFixed(1)} 20 M${(xc + (youRight ? 2 : -2)).toFixed(1)} 15 l${youRight ? 3 : -3} 5 l${youRight ? 4 : -4} -3"/>

function niceStep(range, target = 4) {
  const raw = range / target, mag = 10 ** Math.floor(Math.log10(raw)), n = raw / mag;
  return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * mag;
}
function lineChart(host, pts, opt) {
  // pts: [{t, v, d, photo?}]
  const W = Math.max(260, host.clientWidth), H = opt.h || 200, m = { l: 34, r: 12, t: 18, b: 24 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  let t0 = pts[0].t, t1 = Math.max(pts[pts.length - 1].t, t0 + 864e5 * 6);
  if (opt.proj) t1 = Math.max(t1, Math.min(opt.proj.t, pts[pts.length - 1].t + 864e5 * 70));
  const vals = pts.map(p => p.v).concat(opt.goal != null ? [opt.goal] : []);
  let v0 = Math.min(...vals), v1 = Math.max(...vals);
  const padv = Math.max(0.6, (v1 - v0) * 0.12); v0 -= padv; v1 += padv;
  const step = niceStep(v1 - v0, 4); v0 = Math.floor(v0 / step) * step; v1 = Math.ceil(v1 / step) * step;
  const X = t => m.l + (t - t0) / (t1 - t0) * iw, Y = v => m.t + (1 - (v - v0) / (v1 - v0)) * ih;
  let grid = '';
  for (let v = v0; v <= v1 + 1e-9; v = round(v + step, 4)) grid += `<line class="c-grid" x1="${m.l}" x2="${W - m.r}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text class="c-axis" x="${m.l - 6}" y="${(Y(v) + 3.5).toFixed(1)}" text-anchor="end">${fmt(v, step < 1 ? 1 : 0)}</text>`;
  const nx = W < 360 ? 3 : 4; let xl = '';
  for (let i = 0; i < nx; i++) { const t = t0 + (t1 - t0) * i / (nx - 1); xl += `<text class="c-axis" x="${X(t).toFixed(1)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === nx - 1 ? 'end' : 'middle'}">${new Date(t).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}</text>`; }
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.t).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(' ');
  const area = `${path} L${X(pts[pts.length - 1].t).toFixed(1)} ${m.t + ih} L${X(pts[0].t).toFixed(1)} ${m.t + ih} Z`;
  const last = pts[pts.length - 1];
  let goal = '', proj = '';
  if (opt.goal != null) goal = `<line class="c-goal" x1="${m.l}" x2="${W - m.r}" y1="${Y(opt.goal).toFixed(1)}" y2="${Y(opt.goal).toFixed(1)}"/><text class="c-goal-l" x="${W - m.r}" y="${(Y(opt.goal) - 6).toFixed(1)}" text-anchor="end">Goal ${fmt(opt.goal, 1)}</text>`;
  if (opt.proj) {
    const pt = Math.min(opt.proj.t, t1); const frac = (pt - last.t) / (opt.proj.t - last.t || 1);
    const pv = last.v + (opt.proj.v - last.v) * frac;
    proj = `<path class="c-proj" d="M${X(last.t).toFixed(1)} ${Y(last.v).toFixed(1)} L${X(pt).toFixed(1)} ${Y(pv).toFixed(1)}"/>`;
  }
  const dots = opt.dots ? pts.map(p => `<circle class="c-dot${p.photo ? ' photo' : ''}" cx="${X(p.t).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="4.5"/>`).join('') : '';
  host.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label)}">${grid}${xl}${goal}<path class="c-area" d="${area}"/>${proj}<path class="c-line" d="${path}"/>${dots}
    <line class="c-x" id="cx-${opt.id}" y1="${m.t}" y2="${m.t + ih}" x1="-10" x2="-10" opacity="0"/><circle class="c-end" cx="${X(last.t).toFixed(1)}" cy="${Y(last.v).toFixed(1)}" r="5"/><circle class="c-end" id="ch-${opt.id}" r="5.5" cx="-20" cy="-20" opacity="0"/>
    <rect x="${m.l}" y="0" width="${iw}" height="${H}" fill="transparent" data-hit="${opt.id}"/></svg><div class="tip" id="tip-${opt.id}"></div>`;
  const hit = host.querySelector('[data-hit]'), tip = host.querySelector('.tip'), cx = host.querySelector('#cx-' + opt.id), ch = host.querySelector('#ch-' + opt.id);
  const move = e => {
    const r = hit.getBoundingClientRect(); const x = e.clientX - r.left + m.l;
    let best = pts[0], bd = Infinity; for (const p of pts) { const d = Math.abs(X(p.t) - x); if (d < bd) { bd = d; best = p; } }
    const px = X(best.t), py = Y(best.v);
    cx.setAttribute('x1', px); cx.setAttribute('x2', px); cx.setAttribute('opacity', '1');
    ch.setAttribute('cx', px); ch.setAttribute('cy', py); ch.setAttribute('opacity', '1');
    tip.innerHTML = `${fmt(best.v, 1)}${opt.unit} · ${fmtDate(best.d, { day: 'numeric', month: 'short' })}${best.photo ? ' · photo' : ''}`;
    tip.style.left = clamp(px, 60, W - 60) + 'px'; tip.style.top = (py - 10) + 'px'; tip.classList.add('show');
  };
  const out = () => { tip.classList.remove('show'); cx.setAttribute('opacity', '0'); ch.setAttribute('opacity', '0'); };
  hit.addEventListener('pointermove', move); hit.addEventListener('pointerdown', move); hit.addEventListener('pointerleave', out);
}
function drawWeight(host, D) {

(function sheetDrag() {
  let y0 = 0, t0 = 0, dy = 0, drag = false;

    drag = true; y0 = e.clientY; t0 = performance.now(); dy = 0;

  document.addEventListener('pointermove', e => {

  });
  const end = () => {
    if (!drag) return; drag = false;
    const v = dy / Math.max(1, performance.now() - t0);

  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'chatInput' && finePointer) { e.preventDefault(); if (!Chat.busy) sendChat(e.target.value); }
  if (e.key === 'Enter' && e.target.id === 'ob-name') { e.preventDefault(); obNext(); }
});
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S.profile && !Sheet.isOpen) { const D = derive(); const j = $('[data-journey]'); if (j) drawJourney(j, D); const w = $('[data-chart="weight"]'); if (w) drawWeight(w, D); const bf = $('[data-chart="bf"]'); if (bf) drawBF(bf, D); } }, 150); });

/* =========================================================
   Boot
   ========================================================= */
async function boot() {
  buildTabbar(); render();
  AI.init();
  await Store.init();
  const map = await Store.loadAll();
  if (map.profile && map.profile.sex) {
    S.profile = map.profile;
    S.weights = (map.weights && map.weights.entries) || [];
    S.chat = (map.chat && map.chat.turns) || [];
    S.photos = (map.photos && map.photos.checks) || [];
    for (const [k, v] of Object.entries(map)) if (k.startsWith('day-') && v) S.days[k.slice(4)] = v;
  }
  S.loaded = true; lastTab = null; render();
}
boot();
})();
</script>
